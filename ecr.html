<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Dark mode: saved choice, else the system setting (set before paint to avoid a flash).
    (function () {
      var t = null;
      try { t = localStorage.getItem('ph_theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <title>Emergency Change Template</title>
  <link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div class="site-title" id="siteTitle"></div>
      <span class="user-chip" id="userChip"></span>
      <a class="btn" href="main.html">Home</a>
      <a class="btn btn-primary" id="adminBtn" href="admin.html" hidden>Admin Dashboard</a>
      <button class="btn theme-toggle" type="button" data-theme-toggle>🌙 Dark</button>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  </header>

  <main class="page ecr" id="app"></main>
  <div class="toast" id="toast"></div>

  <script src="js/common.js?v=5"></script>
  <script src="js/template-form.js?v=7"></script>
  <script src="js/ecr.js?v=7"></script>
</body>
</html>
