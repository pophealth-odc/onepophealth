<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Dark mode: saved choice, else the system setting (set before paint to avoid a flash).
    (function () {
      var t = null;
      try { t = localStorage.getItem('ph_theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <title>Home</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <div class="site-title" id="siteTitle"></div>
      <span class="user-chip" id="userChip"></span>
      <a class="btn" id="approvalsBtn" href="approvals.html" hidden>Approvals</a>
      <a class="btn btn-primary" id="adminBtn" href="admin.html" hidden>Admin Dashboard</a>
      <button class="btn theme-toggle" type="button" data-theme-toggle>🌙 Dark</button>
      <button class="btn" id="logoutBtn">Log out</button>
    </div>
  </header>
  <div class="banner" id="draftBanner" hidden>
    You are viewing unpublished draft changes (only visible in this browser).
  </div>
  <main class="page">
    <div class="page-grid" id="page"></div>
  </main>

  <script src="js/common.js?v=10"></script>
  <script>
    (async () => {
      if (!PH.requireLogin()) return;
      const session = await PH.refreshSession(); // picks up role / domain changes
      if (!session) return;

      document.getElementById('userChip').textContent = `${session.username} · ${session.role} · ${PH.userDomain(session)}`;
      if (PH.isAdmin(session)) document.getElementById('adminBtn').hidden = false;
      // Approvals go with the change templates (domains set in Admin → Users → Domains).
      const layoutForAccess = await PH.getLayout().catch(() => ({}));
      if (PH.can(session, 'approve') && PH.allowedIn(session, PH.pageDomains(layoutForAccess, 'templates'))) {
        const btn = document.getElementById('approvalsBtn');
        btn.hidden = false;
        // Show how many requests are waiting (quietly skipped if approvals aren't set up yet).
        // Approvers count only their domain's requests; Admins count all.
        const scope = PH.isAdmin(session) ? Promise.resolve('') : PH.submittedInDomain(PH.userDomain(session));
        Promise.all([PH.approvalsDb(), scope]).then(([db, q]) => db.list(`select=id&status=eq.pending${q}`)).then(rows => {
          if (rows.length) btn.textContent = `Approvals (${rows.length})`;
        }).catch(() => {});
      }
      document.getElementById('logoutBtn').onclick = () => { PH.clearSession(); location.href = 'index.html'; };

      try {
        await PH.reconcileDrafts();
        const layout = await PH.getLayout();
        PH.applyTheme(layout.theme);
        const siteTitle = PH.fillTokens(layout.theme.siteTitle || '', PH.tokenVars(layout, PH.userDomain(session)));
        document.title = siteTitle || 'Home';
        document.getElementById('siteTitle').textContent = siteTitle;
        const banner = document.getElementById('draftBanner');
        const draft = PH.draftState();
        banner.hidden = draft === 'none';
        if (draft === 'deploying') {
          banner.textContent = '✔ Published. GitHub Pages is updating (can take a few minutes) — this message disappears once the live site is updated.';
        }
        PH.renderPage(layout, document.getElementById('page'), session);
      } catch (err) {
        document.getElementById('page').replaceChildren(PH.el('div', { class: 'w-empty', style: { gridColumn: 'span 12' }, text: 'Could not load page: ' + err.message }));
      }
    })();
  </script>
</body>
</html>
