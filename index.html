<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Dark mode: saved choice, else the system setting (set before paint to avoid a flash).
    (function () {
      var t = null;
      try { t = localStorage.getItem('ph_theme'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <title>Login</title>
  <link rel="stylesheet" href="css/style.css?v=22">
</head>
<body>
  <button class="btn theme-toggle login-theme" type="button" data-theme-toggle>🌙 Dark</button>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <h1 id="siteTitle">Sign in</h1>
      <p class="muted">Enter your username to continue.</p>
      <label for="username">Username</label>
      <input id="username" name="username" required autofocus autocomplete="username">
      <div class="error" id="error"></div>
      <button class="btn btn-primary" type="submit">Continue</button>
    </form>
  </div>

  <script src="js/common.js?v=10"></script>
  <script>
    (async () => {
      if (PH.getSession()) { location.replace('main.html'); return; }

      try {
        const layout = await PH.getLayout();
        PH.applyTheme(layout.theme);
        // Before sign-in the domain isn't known, so placeholders show the default domain.
        document.getElementById('siteTitle').textContent =
          PH.fillTokens(layout.theme.siteTitle || 'Sign in', PH.tokenVars(layout, PH.DEFAULT_DOMAIN));
      } catch { /* theme is optional on the login page */ }

      const form = document.getElementById('loginForm');
      const error = document.getElementById('error');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        error.textContent = '';
        const name = document.getElementById('username').value.trim().toLowerCase();
        if (!name) return;
        try {
          const users = await PH.getUsers();
          const user = users.find(u => u.username.toLowerCase() === name);
          if (!user) { error.textContent = 'Unknown username.'; return; }
          PH.setSession(user);
          location.href = 'main.html';
        } catch (err) {
          error.textContent = 'Could not load users: ' + err.message;
        }
      });
    })();
  </script>
</body>
</html>
